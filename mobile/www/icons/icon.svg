      <stop offset="0%" stop-color="#1a0710"/>
      <stop offset="70%" stop-color="#070a11"/>
      <stop offset="100%" stop-color="#05060a"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#fff3f5"/>
