name: Native Android APK

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Unit tests
        working-directory: native
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: native
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: orb-native-debug-apk
          path: native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.ORB_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ORB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ORB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ORB_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orb-release.jks"
            {
              echo "ORB_KEYSTORE_PATH=$RUNNER_TEMP/orb-release.jks"
              echo "ORB_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ORB_KEY_ALIAS=$KEY_ALIAS"
              echo "ORB_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No ORB_KEYSTORE_BASE64 secret; the release APK will use the debug key."
          fi

      - name: Build release APK
        working-directory: native
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: orb-native-release-apk
          path: native/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
